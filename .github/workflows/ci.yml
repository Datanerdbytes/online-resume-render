name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production deployments on this repository happen through Render's Blueprint
# sync on push (render.yaml), not through GitHub Actions. CI verifies changes only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: "0"

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=low
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: node --test scripts/tests/deployment-smoke.test.mjs
      - run: npm run build:web

  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # pragma: allowlist secret — disposable CI service
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --project apps/api --locked
      - name: Audit Python dependencies
        run: uv audit --locked
        working-directory: apps/api
      - run: uv run ruff check .
        working-directory: apps/api
      - run: uv run mypy --explicit-package-bases app
        working-directory: apps/api
      - name: Unit and PostgreSQL integration tests, including migrations
        run: uv run pytest --run-integration
        working-directory: apps/api
        env:
          # Disposable runner-local service. Never use Neon credentials here.
          TEST_DATABASE_ADMIN_URL: postgresql+psycopg://ci:ci@localhost:5432/postgres # pragma: allowlist secret — disposable CI service
      - name: Scan tracked files for secrets
        run: node scripts/check-secrets.mjs

  repository-files:
    name: Repository file checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - run: npm ci
      - run: uv sync --project apps/api --locked
      - run: npm run format:check:pr
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/check-staged-files.mjs --all

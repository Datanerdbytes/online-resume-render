# Render Blueprint for the isolated copy of online-portfolio.
#
# Deployed automatically on every push to main via Render's Blueprint sync.
# Secrets are marked `sync: false`; they are entered once in the Render
# Dashboard during Blueprint creation and are never stored in this repository.
#
# See docs/render-deployment.md for the full deployment guide.
services:
  # Next.js frontend (apps/web). Talks to FastAPI server-side only via API_BASE_URL.
  # autoDeploy is disabled: deploys are triggered by the gated GitHub Actions
  # pipeline, so only checked, approved commits reach production.
  - type: web
    name: online-resume-web
    runtime: node
    plan: free
    autoDeploy: false
    previewsEnabled: false
    buildCommand: HUSKY=0 npm ci --include=dev --workspaces --include-workspace-root && npm run build:web
    startCommand: npm run start --workspace=apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Exact HTTPS origin of THIS web service (no trailing slash). Required for
      # admin auth cookies and CSRF origin checks.
      - key: ADMIN_WEB_ORIGIN
        value: https://online-resume-web.onrender.com
      # Public URL of the API service below.
      - key: API_BASE_URL
        value: https://online-resume-api.onrender.com
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_COOKIE_SECRET
        sync: false

  # FastAPI backend (apps/api). Shares the existing Neon production database.
  # autoDeploy is disabled: deploys are triggered by the gated GitHub Actions pipeline.
  - type: web
    name: online-resume-api
    runtime: python
    plan: free
    autoDeploy: false
    previewsEnabled: false
    rootDir: apps/api
    # uv sync includes the dev group, which provides uvicorn for the start command.
    buildCommand: pip install uv && uv sync --frozen
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_POOL_MODE
        value: external
      - key: MEDIA_STORAGE
        value: database
      # Neon pooled connection string, postgresql+psycopg:// scheme.
      - key: DATABASE_URL
        sync: false
      # Exact HTTPS origin of the web service above. Informational (API root).
      - key: WEB_APP_URL
        value: https://online-resume-web.onrender.com
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: PUBLIC_PORTFOLIO_USER_ID
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: RESUME_IMPORT_ENABLED
        sync: false
